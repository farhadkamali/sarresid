name: Android build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      # Keep one debug signing key across builds so the Firebase SHA-1 stays stable.
      - name: Cache debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: sarresid-debug-keystore-v1
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Print debug SHA-1
        run: |
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android | grep -E 'SHA1:'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sarresid-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
